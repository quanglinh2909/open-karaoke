[package]
name = "open-karaoke"
version = "0.2.1"
description = "Open Karaoke — open-source karaoke studio with real-time autotune"
authors = ["Open Karaoke contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "open_karaoke_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt", "macros", "fs", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

# audio
cpal = "0.18"
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4", "mp3", "wav", "pcm", "flac", "ogg", "vorbis", "mkv"] }
rubato = "0.16"
realfft = "3"
ringbuf = "0.4"
crossbeam-channel = "0.5"
hound = "3"
signalsmith-stretch = "0.1"
sha2 = "0.10"
whisper-rs = "0.16"
tiny-skia = "0.11"
rustybuzz = "0.20"

# WASAPI exclusive mode (low-latency singing); cpal only does shared mode.
[target.'cfg(windows)'.dependencies]
# ASIO (Steinberg) host, for drivers such as ASIO Link Pro or ASIO4ALL: the
# low-latency path DAWs use. Building it needs the ASIO SDK (CPAL_ASIO_DIR).
cpal = { version = "0.18", features = ["asio"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }

[profile.dev]
# DSP code is far too slow unoptimised; keep debug builds usable for singing.
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# AI vocal separation (MDX-Net) on ONNX Runtime. No prebuilt runtime exists
# for Intel Macs; there the app falls back to the basic vocal remover.
[target.'cfg(not(all(target_os = "macos", target_arch = "x86_64")))'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-rustls", "copy-dylibs", "api-31"] }

# Build scripts without debug assertions: whisper-rs-sys otherwise compiles
# whisper.cpp with WHISPER_DEBUG, which logs every decoded token.
[profile.dev.build-override]
debug-assertions = false
